<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vishwa's Meme Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header-container">
    <h1>Vishwa's Meme Calculator</h1>
    <span class="meme-list">Meme targets: 0, 1, 2, 3, 4, 7, 10, 50, 150, 786, 2000</span>
  </div>

  <div id="vishwaCalculator">
    <div class="input-group">
      <input type="number" id="vishwaNum1" placeholder="Enter first number" />
      <select id="vishwaOperator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input type="number" id="vishwaNum2" placeholder="Enter second number" />
    </div>
    <button onclick="vishwaCalculate()">Calculate</button>
    <div id="vishwaResult">Result will appear here</div>
    <div id="vishwaImage"></div>
  </div>

  <script>
    function vishwaCalculate() {
      let vishwaNum1 = parseFloat(document.getElementById('vishwaNum1').value);
      let vishwaNum2 = parseFloat(document.getElementById('vishwaNum2').value);
      let vishwaOperator = document.getElementById('vishwaOperator').value;
      let vishwaResult;

      let resultDiv = document.getElementById('vishwaResult');
      let vishwaImageDiv = document.getElementById('vishwaImage');

      // Clear states
      resultDiv.classList.remove('active');
      vishwaImageDiv.classList.remove('show');
      vishwaImageDiv.innerHTML = '';

      if (isNaN(vishwaNum1) || isNaN(vishwaNum2)) {
        resultDiv.innerText = 'Please enter both numbers';
        return;
      }

      switch (vishwaOperator) {
        case '+': vishwaResult = vishwaNum1 + vishwaNum2; break;
        case '-': vishwaResult = vishwaNum1 - vishwaNum2; break;
        case '*': vishwaResult = vishwaNum1 * vishwaNum2; break;
        case '/': 
          if (vishwaNum2 === 0) {
            resultDiv.innerText = 'Cannot divide by zero';
            return;
          }
          vishwaResult = vishwaNum1 / vishwaNum2; 
          break;
        default: vishwaResult = 'Error';
      }

      // Format result to avoid long floating numbers where possible
      if (typeof vishwaResult === 'number' && !Number.isInteger(vishwaResult)) {
        vishwaResult = Math.round(vishwaResult * 100) / 100;
      }

      resultDiv.innerText = 'Result: ' + vishwaResult;
      resultDiv.classList.add('active');

      let imageMap = {
        0: 'a0.jpg',
        1: 'a1.jpg',
        2: 'a2.jpg',
        3: 'a3.jpg',
        4: 'a4.jpg',
        7: 'a7.jpg',
        10: 'a10.jpg',
        50: 'a50.jpg',
        150: 'a150.jpg',
        786: 'a786.jpg',
        2000: 'a2000.jpg'
      };

      if (vishwaResult in imageMap) {
        let vishwaImg = document.createElement('img');
        vishwaImg.src = 'img/' + imageMap[vishwaResult];
        vishwaImg.alt = 'Number ' + vishwaResult + ' Image';
        vishwaImageDiv.appendChild(vishwaImg);
        
        // Trigger transition
        setTimeout(() => {
          vishwaImageDiv.classList.add('show');
        }, 50);
      }
    }
  </script>
</body>
</html>
