<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vishwa Calculator </title>
  <style>
    body {
        
        
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      font-family: 'Segoe UI', Gotham Rounded, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #vishwaCalculator {
      background: #fff;
      box-shadow: 0 8px 32px -7px #74ebd5, 0 1.5px 3px rgba(60,60,90,0.10);
      border-radius: 22px;
      padding: 2.5rem 2.0rem 2.2rem 2.0rem;
      width: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    input[type="number"], select {
      width: 85%;
      padding: 9px 12px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid #eee;
      font-size: 1.2rem;
      outline: none;
      background-color: #f8faff;
      box-shadow: 1px 1px 5px #ACB6E533;
      transition: border 0.2s;
    }
    select {
      background: #e7eaf5;
    }
    input[type="number"]:focus, select:focus {
      border: 1.5px solid #74ebd5;
    }
    button {
      width: 90%;
      font-size: 1.3rem;
      background: linear-gradient(90deg, #74ebd5, #ACB6E5);
      color: #234;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      box-shadow: 0 2px 12px #74ebd566;
      padding: 12px 0;
      margin-top: 18px;
      cursor: pointer;
      transition: background 0.24s, transform 0.13s;
    }
    button:hover {
      background: linear-gradient(90deg, #ACB6E5, #74ebd5);
      transform: scale(1.04);
    }
    #vishwaResult {
      margin-top: 20px;
      font-size: 2rem;
      color: #345;
      background: #f6fdff;
      border-radius: 12px;
      padding: 10px;
      min-height: 32px;
      text-align: center;
      box-shadow: 0 0px 8px #ACB6E522;
    }
    #vishwaImage {
      margin-top: 26px;
      text-align: center;
    }
    #vishwaImage img {
      border-radius: 20px;
      box-shadow: 0 2px 18px #74ebd555;
      width: 180px;
      max-width: 90%;
    }
  </style>
</head>
    <body>
  <h1 style="text-align:center;">
  vishwa MEME Calculator
</h1>

<p style="text-align:center; color:#333;">
 <br></br>
  <br><h2> (0,1,2,3,4,5,7,10,50,150,786,2000)</h2></br>
</p>
  <div id="vishwaCalculator">
    <input type="number" id="vishwaNum1" placeholder="Enter first number" />
    <input type="number" id="vishwaNum2" placeholder="Enter second number" />
    <select id="vishwaOperator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>
    <button onclick="vishwaCalculate()">Calculate</button>
    <div id="vishwaResult"></div>
    <div id="vishwaImage"></div>
  </div>


  <script>
    function vishwaCalculate() {
      let vishwaNum1 = parseFloat(document.getElementById('vishwaNum1').value);
      let vishwaNum2 = parseFloat(document.getElementById('vishwaNum2').value);
      let vishwaOperator = document.getElementById('vishwaOperator').value;
      let vishwaResult;

      switch (vishwaOperator) {
        case '+': vishwaResult = vishwaNum1 + vishwaNum2; break;
        case '-': vishwaResult = vishwaNum1 - vishwaNum2; break;
        case '*': vishwaResult = vishwaNum1 * vishwaNum2; break;
        case '/': vishwaResult = vishwaNum1 / vishwaNum2; break;
        default: vishwaResult = 'Error';
      }

      document.getElementById('vishwaResult').innerText = 'Result: ' + vishwaResult;

      // Show image if result is 150
      let vishwaImageDiv = document.getElementById('vishwaImage');
      vishwaImageDiv.innerHTML = '';
      if (vishwaResult === 150) {
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a150.jpg"; // Replace with your own image path
        vishwaImg.alt = 'Number 150 Image';
        vishwaImageDiv.appendChild(vishwaImg);

      }         else if (vishwaResult === 50) {
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a50.jpg"; // Replace with your image for 50
        vishwaImg.alt = 'Number 50 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    } else if (vishwaResult === 786) {
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a786.jpg"; // Replace with your image for 786
        vishwaImg.alt = 'Number 786 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    } else if (vishwaResult === 2000) {
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a2000.jpg"; // Replace with your image for 2000
        vishwaImg.alt = 'Number 2000 Image';
        vishwaImageDiv.appendChild(vishwaImg);
}
else if (vishwaResult === 1) {
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a1.jpg"; // Replace with your image for 1
        vishwaImg.alt = 'Number 1 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    }else if (vishwaResult === 2 ){
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a2.jpg"; // Replace with your image for 2
        vishwaImg.alt = 'Number 2 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    }else if (vishwaResult === 0 ){
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a0.jpg"; // Replace with your image for 0
        vishwaImg.alt = 'Number 0 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    }
    else if (vishwaResult === 10 ){
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a10.jpg"; // Replace with your image for 10
        vishwaImg.alt = 'Number 10 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    } else if (vishwaResult === 4){
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a4.jpg"; // Replace with your image for 4
        vishwaImg.alt = 'Number 4 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    } else if (vishwaResult === 3 ){
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a3.jpg"; // Replace with your image for 3
        vishwaImg.alt = 'Number 3 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    } else if (vishwaResult === 7 ){
        let vishwaImg = document.createElement('img');
        vishwaImg.src = "img/a7.jpg"; // Replace with your image for 7
        vishwaImg.alt = 'Number 7 Image';
        vishwaImageDiv.appendChild(vishwaImg);
    }

}
  </script>
</body>
</html>
